name: release

# Сборка установщиков под macOS и Windows.
# - пуш тега vX.Y.Z  → соберёт и создаст черновик Release с установщиками;
# - ручной запуск (workflow_dispatch) → соберёт и приложит артефакты к прогону.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Установить зависимости фронта
        run: npm ci

      - name: Собрать приложение (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ВНИМАНИЕ: не объявляй здесь переменные подписи «про запас».
          # Отсутствующий секрет подставляется пустой строкой, а tauri-action
          # считает переменную заданной и пытается импортировать пустой
          # сертификат — сборка macOS падает на `security import`.
          #
          # Когда появятся ключи, добавь сюда СРАЗУ С НЕПУСТЫМИ секретами:
          #
          #   подпись обновлений (плюс createUpdaterArtifacts: true в
          #   tauri.conf.json и includeUpdaterJson: true ниже):
          #     TAURI_SIGNING_PRIVATE_KEY
          #     TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          #
          #   подпись и нотаризация macOS, без них Gatekeeper на чужой машине
          #   говорит «приложение повреждено»:
          #     APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          #     APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          # Включить вместе с createUpdaterArtifacts в tauri.conf.json, когда
          # появятся ключи подписи: без артефактов обновления генерировать
          # latest.json нечем, и шаг падает.
          includeUpdaterJson: false
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Книжник ${{ github.ref_name }}'
          # Инструкция для macOS обязательна в каждом релизе: приложение не
          # подписано у Apple, и без снятия карантина Gatekeeper говорит
          # «повреждено» — люди решают, что сборка битая. Убрать этот блок
          # можно только после того, как заработает подпись Developer ID.
          releaseBody: |
            ## Что скачать

            | Система | Файл |
            |---|---|
            | **macOS** (Intel и Apple Silicon) | `*_universal.dmg` |
            | **Windows** | `*_x64-setup.exe` или `*_x64_en-US.msi` |

            ---

            ## ⚠️ macOS: как запустить

            Приложение пока **не подписано у Apple**, поэтому при первом запуске
            macOS скажет, что оно «повреждено и не может быть открыто». Файл
            в порядке — это Gatekeeper блокирует всё скачанное без подписи
            Developer ID.

            1. Открой `.dmg` и перетащи **knizhnik** в папку «Программы».
            2. Открой Терминал и выполни:

            ```bash
            xattr -dr com.apple.quarantine /Applications/knizhnik.app
            ```

            3. Запусти приложение обычным способом.

            Флаг `-r` обязателен: `.app` — это папка, и метка карантина висит
            не только на ней, но и на вложенных файлах. Команду нужно выполнить
            **после** перетаскивания в «Программы», а не на файле внутри
            примонтированного образа — иначе метка приедет вместе с копией.

            **Без терминала:** правый клик по приложению → **Открыть** →
            «Всё равно открыть». Достаточно одного раза.

            Проверить, стоит ли карантин:

            ```bash
            xattr -l /Applications/knizhnik.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Приложить установщики к прогону
        uses: actions/upload-artifact@v4
        with:
          name: knizhnik-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.dmg
