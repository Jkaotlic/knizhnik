name: release

# Сборка установщиков под macOS и Windows.
# - пуш тега vX.Y.Z  → соберёт и создаст черновик Release с установщиками;
# - ручной запуск (workflow_dispatch) → соберёт и приложит артефакты к прогону.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Установить зависимости фронта
        run: npm ci

      - name: Собрать приложение (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Книжник ${{ github.ref_name }}'
          releaseBody: 'Установщики для Windows (.msi / .exe) и macOS (.dmg). Собрано автоматически через GitHub Actions.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Приложить установщики к прогону
        uses: actions/upload-artifact@v4
        with:
          name: knizhnik-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.dmg
